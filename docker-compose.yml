services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./gatsby-config.js:/app/gatsby-config.js
      - ./gatsby-node.js:/app/gatsby-node.js
      - /app/node_modules
      - /app/.cache
      - /app/public
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
